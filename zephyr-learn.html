<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zephyr learn — учи HTML & CSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── RESET & BASE ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0f11;
  --bg2: #16181c;
  --bg3: #1e2026;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0f0ee;
  --muted: #8a8d96;
  --muted2: #555860;
  --accent: #9900f1;
  --accent-dim: rgba(74,222,128,0.12);
  --accent-border: rgba(74,222,128,0.3);
  --orange: #fb923c;
  --orange-dim: rgba(251,146,60,0.12);
  --blue: #60a5fa;
  --blue-dim: rgba(96,165,250,0.12);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.12);
  --yellow: #fbbf24;
  --yellow-dim: rgba(251,191,36,0.1);
  --radius: 10px;
  --radius-lg: 14px;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Onest', sans-serif;
}
html { font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.6; }
body { min-height: 100vh; }

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }

/* ─── LAYOUT ─── */
#app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

/* ─── SIDEBAR ─── */
#sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-icon {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.logo-text { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.logo-sub { font-size: 10px; color: var(--muted); font-weight: 400; }

.sidebar-xp {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.xp-bar-wrap { flex: 1; height: 5px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
.xp-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.5s ease; }
.xp-num { font-size: 12px; font-weight: 600; color: var(--accent); }

.sidebar-courses { padding: 10px 10px; flex: 1; }
.sidebar-section-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted2);
  padding: 6px 10px 4px;
}
.course-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s;
  border: 1px solid transparent;
}
.course-item:hover { background: var(--bg3); }
.course-item.active { background: var(--accent-dim); border-color: var(--accent-border); }
.course-icon { font-size: 18px; flex-shrink: 0; }
.course-info { flex: 1; min-width: 0; }
.course-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.course-meta { font-size: 11px; color: var(--muted); }
.course-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 99px;
  background: var(--accent-dim);
  color: var(--accent);
  flex-shrink: 0;
}
.course-badge.locked { background: var(--bg3); color: var(--muted); }
.topic-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px 6px 28px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  color: var(--muted);
  transition: all 0.15s;
}
.topic-item:hover { color: var(--text); background: var(--bg3); }
.topic-item.active { color: var(--accent); }
.topic-item.done { color: var(--muted); }
.topic-item .t-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--muted2);
  transition: background 0.15s;
}
.topic-item.done .t-dot { background: var(--accent); }
.topic-item.active .t-dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

/* ─── MAIN ─── */
#main { padding: 32px 40px; max-width: 780px; }

/* ─── SCREEN: HOME ─── */
.home-hero { margin-bottom: 32px; }
.home-hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 8px; }
.home-hero p { font-size: 15px; color: var(--muted); }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px; }
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
}
.stat-label { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.stat-val { font-size: 24px; font-weight: 700; }
.stat-val.green { color: var(--accent); }
.stat-val.orange { color: var(--orange); }
.stat-val.blue { color: var(--blue); }

.continue-card {
  background: var(--accent-dim);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  cursor: pointer;
  transition: border-color 0.15s;
  margin-bottom: 24px;
}
.continue-card:hover { border-color: var(--accent); }
.continue-emoji { font-size: 32px; }
.continue-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
.continue-info p { font-size: 13px; color: var(--muted); }
.continue-btn {
  margin-left: auto;
  background: var(--accent);
  color: #0e0f11;
  border: none;
  border-radius: var(--radius);
  padding: 9px 20px;
  font-size: 13px;
  font-weight: 700;
  font-family: var(--sans);
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.15s;
}
.continue-btn:hover { opacity: 0.85; }

.courses-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.course-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.course-card:hover { border-color: var(--border2); background: var(--bg3); }
.course-card-icon { font-size: 24px; margin-bottom: 10px; }
.course-card-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.course-card-desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.mini-progress { height: 4px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
.mini-progress-bar { height: 100%; background: var(--accent); border-radius: 99px; }
.course-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--muted); }

/* ─── SCREEN: LESSON ─── */
.lesson-wrap { animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.lesson-topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}
.back-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: var(--radius);
  padding: 6px 14px;
  font-size: 12px;
  font-family: var(--sans);
  cursor: pointer;
  transition: all 0.15s;
}
.back-btn:hover { border-color: var(--border2); color: var(--text); }
.lesson-progress { flex: 1; height: 6px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
.lesson-progress-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }
.lesson-xp-live { font-size: 12px; font-weight: 600; color: var(--accent); }

/* ─── THEORY SCREEN ─── */
.theory-header { margin-bottom: 24px; }
.theory-course-tag {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--orange);
  background: var(--orange-dim);
  border-radius: 99px;
  padding: 3px 10px;
  display: inline-block;
  margin-bottom: 10px;
}
.theory-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 6px; }
.theory-subtitle { font-size: 14px; color: var(--muted); }

.theory-body { font-size: 15px; color: var(--text); line-height: 1.75; }
.theory-body h3 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; color: var(--text); }
.theory-body p { margin-bottom: 12px; }
.theory-body ul { padding-left: 18px; margin-bottom: 12px; }
.theory-body ul li { margin-bottom: 4px; }
.theory-body .note {
  background: var(--blue-dim);
  border-left: 3px solid var(--blue);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 12px 16px;
  font-size: 13px;
  color: var(--blue);
  margin: 16px 0;
}
.theory-body .warn {
  background: var(--yellow-dim);
  border-left: 3px solid var(--yellow);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 12px 16px;
  font-size: 13px;
  color: var(--yellow);
  margin: 16px 0;
}

.code-block {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.65;
  margin: 12px 0 16px;
  overflow-x: auto;
  color: #e2e8f0;
}
.code-block .tag { color: #f472b6; }
.code-block .attr { color: #60a5fa; }
.code-block .val { color: #4ade80; }
.code-block .comment { color: #6b7280; }
.code-block .prop { color: #a78bfa; }
.code-block .num { color: #fb923c; }

.theory-nav {
  display: flex;
  justify-content: flex-end;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.btn-primary {
  background: var(--accent);
  color: #0e0f11;
  border: none;
  border-radius: var(--radius);
  padding: 11px 24px;
  font-size: 14px;
  font-weight: 700;
  font-family: var(--sans);
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-secondary {
  background: none;
  border: 1px solid var(--border2);
  color: var(--text);
  border-radius: var(--radius);
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 500;
  font-family: var(--sans);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-secondary:hover { background: var(--bg3); }

/* ─── QUIZ ─── */
.quiz-tag {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--blue);
  background: var(--blue-dim); border-radius: 99px;
  padding: 3px 10px; display: inline-block; margin-bottom: 10px;
}
.quiz-q { font-size: 18px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.2px; }
.quiz-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

/* Multiple choice */
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice-btn {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 13px 16px;
  font-size: 14px;
  font-family: var(--sans);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.choice-btn:hover:not(:disabled) { background: var(--bg3); border-color: var(--border2); }
.choice-btn.correct { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.choice-btn.wrong { background: var(--red-dim); border-color: var(--red); color: var(--red); }
.choice-letter {
  width: 26px; height: 26px;
  border-radius: 6px;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
  color: var(--muted);
}
.choice-btn.correct .choice-letter { background: var(--accent); color: #0e0f11; }
.choice-btn.wrong .choice-letter { background: var(--red); color: #fff; }

/* Code quiz */
.code-quiz-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0; }
.pane-head { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.dot-g { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.dot-b { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
textarea.code-editor {
  width: 100%;
  height: 160px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
  padding: 10px 12px;
  resize: vertical;
  outline: none;
  transition: border-color 0.15s;
}
textarea.code-editor:focus { border-color: var(--accent); }
.preview-frame {
  height: 160px;
  background: #fff;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
}
.preview-frame iframe { width: 100%; height: 100%; border: none; }

/* Fill-in-the-blank */
.fill-line { font-size: 15px; font-family: var(--mono); background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; line-height: 1.8; }
.fill-input {
  background: none;
  border: none;
  border-bottom: 2px solid var(--accent);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 15px;
  width: 120px;
  outline: none;
  padding: 0 4px;
  text-align: center;
}

/* Feedback bar */
.quiz-feedback {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  display: none;
  gap: 10px;
  align-items: flex-start;
}
.quiz-feedback.show { display: flex; }
.quiz-feedback.ok { background: var(--accent-dim); border: 1px solid var(--accent-border); color: var(--accent); }
.quiz-feedback.fail { background: var(--red-dim); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
.quiz-feedback .fb-icon { font-size: 16px; flex-shrink: 0; }
.quiz-feedback .fb-msg { flex: 1; }
.quiz-feedback .fb-msg strong { display: block; margin-bottom: 2px; }

.quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.btn-check {
  background: var(--accent);
  color: #0e0f11;
  border: none;
  border-radius: var(--radius);
  padding: 10px 22px;
  font-size: 13px;
  font-weight: 700;
  font-family: var(--sans);
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-check:hover { opacity: 0.85; }
.btn-check:disabled { opacity: 0.4; cursor: default; }

/* ─── COMPLETION ─── */
.complete-wrap { text-align: center; padding: 40px 20px; animation: fadeIn 0.3s ease; }
.complete-icon { font-size: 56px; margin-bottom: 16px; }
.complete-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.complete-sub { font-size: 15px; color: var(--muted); margin-bottom: 28px; }
.xp-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--accent-dim);
  border: 1px solid var(--accent-border);
  color: var(--accent);
  border-radius: 99px;
  padding: 8px 20px;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 28px;
}
.complete-btns { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="logo">
      <div class="logo-icon">🏷</div>
      <div>
        <div class="logo-text">Zephyr learn</div>
        <div class="logo-sub">HTML & CSS курсы</div>
      </div>
    </div>
    <div class="sidebar-xp">
      <div class="xp-bar-wrap"><div class="xp-bar" id="sb-xp-bar" style="width:0%"></div></div>
      <div class="xp-num" id="sb-xp">0 XP</div>
    </div>
    <div class="sidebar-courses" id="sidebar-courses"></div>
  </div>
  <div id="main"></div>
</div>

<script>
/* ══════════════════════════════════════════════════
   ДАННЫЕ КУРСОВ — добавляй новые курсы здесь!
   
   Структура:
   {
     id: уникальный id,
     icon: эмодзи,
     name: название,
     description: описание,
     topics: [
       {
         id: уникальный id,
         name: название темы,
         theory: {
           title, subtitle, html  ← html-строка с теорией
         },
         quiz: [
           Типы вопросов:
           
           1) { type: 'choice', q, choices: ['A','B','C','D'], correct: 0 }
              correct — индекс правильного ответа
           
           2) { type: 'code', q, starter, check: (code) => boolean, hint }
              check — функция-валидатор
           
           3) { type: 'fill', q, line: 'код с ___ вместо пропуска', answer: 'слово', hint }
         ]
       }
     ]
   }
══════════════════════════════════════════════════ */
const COURSES = [
  {
    id: 'html-basics',
    icon: '🧱',
    name: 'HTML: Основы',
    description: 'Теги, структура, атрибуты',
    topics: [
      {
        id: 'what-is-html',
        name: 'Что такое HTML',
        theory: {
          title: 'Что такое HTML?',
          subtitle: 'Строительные блоки любой веб-страницы',
          html: `
            <p>HTML (HyperText Markup Language) — это язык разметки, который описывает структуру страницы. Браузер читает HTML и показывает его как страницу.</p>
            <div class="note">💡 HTML — не язык программирования. Он не считает и не принимает решений. Он просто говорит: «здесь заголовок», «здесь абзац», «здесь картинка».</div>
            <h3>Как устроен тег?</h3>
            <p>HTML состоит из <strong>тегов</strong>. Большинство тегов идут парой — открывающий и закрывающий:</p>
            <div class="code-block"><span class="tag">&lt;h1&gt;</span>Это заголовок<span class="tag">&lt;/h1&gt;</span>
<span class="tag">&lt;p&gt;</span>Это абзац текста<span class="tag">&lt;/p&gt;</span></div>
            <h3>Базовые теги</h3>
            <ul>
              <li><code>&lt;h1&gt; ... &lt;h6&gt;</code> — заголовки (h1 самый крупный)</li>
              <li><code>&lt;p&gt;</code> — абзац</li>
              <li><code>&lt;br&gt;</code> — перенос строки (одиночный тег)</li>
              <li><code>&lt;strong&gt;</code> — <strong>жирный</strong> текст</li>
              <li><code>&lt;em&gt;</code> — <em>курсив</em></li>
            </ul>
            <h3>Скелет страницы</h3>
            <div class="code-block"><span class="tag">&lt;!DOCTYPE html&gt;</span>
<span class="tag">&lt;html&gt;</span>
  <span class="tag">&lt;head&gt;</span>
    <span class="tag">&lt;title&gt;</span>Название вкладки<span class="tag">&lt;/title&gt;</span>
  <span class="tag">&lt;/head&gt;</span>
  <span class="tag">&lt;body&gt;</span>
    <span class="comment">&lt;!-- Весь видимый контент здесь --&gt;</span>
    <span class="tag">&lt;h1&gt;</span>Привет, мир!<span class="tag">&lt;/h1&gt;</span>
  <span class="tag">&lt;/body&gt;</span>
<span class="tag">&lt;/html&gt;</span></div>
            <div class="warn">⚠️ Всегда закрывай теги! Незакрытый тег может сломать разметку всей страницы.</div>
          `
        },
        quiz: [
          {
            type: 'choice',
            q: 'Что означает аббревиатура HTML?',
            choices: [
              'HyperText Markup Language',
              'High Tech Modern Layout',
              'Home Tool Markup Language',
              'Hyper Transfer Method Link'
            ],
            correct: 0,
            explain: 'HTML расшифровывается как HyperText Markup Language — язык гипертекстовой разметки.'
          },
          {

/* ══════ STATE ══════ */
let state = {
  xp: 0,
  done: {},     // { topicId: true }
  screen: 'home',
  activeCourse: null,
  activeTopic: null,
  step: 0,      // 0 = theory, 1..n = quiz questions
  lessonXP: 0,
  answered: false,
  selectedChoice: null,
};

function save() { try { localStorage.setItem('ts_state', JSON.stringify({ xp: state.xp, done: state.done })); } catch(e){} }
function load() { try { const d = JSON.parse(localStorage.getItem('ts_state')||'{}'); state.xp = d.xp||0; state.done = d.done||{}; } catch(e){} }
load();

/* ══════ HELPERS ══════ */
function totalTopics() { return COURSES.reduce((a,c) => a + c.topics.length, 0); }
function doneCourse(course) { return course.topics.filter(t => state.done[t.id]).length; }
function topicProgress(course) { return Math.round(doneCourse(course) / course.topics.length * 100); }
function nextUndone() {
  for (const c of COURSES) for (const t of c.topics) if (!state.done[t.id]) return { course: c, topic: t };
  return null;
}

/* ══════ RENDER ══════ */
function render() {
  renderSidebar();
  const main = document.getElementById('main');
  if (state.screen === 'home') main.innerHTML = renderHome();
  else if (state.screen === 'lesson') main.innerHTML = renderLesson();
  bindEvents();
}

function renderSidebar() {
  const doneCount = Object.keys(state.done).length;
  const total = totalTopics();
  const pct = total ? Math.round(doneCount / total * 100) : 0;
  document.getElementById('sb-xp').textContent = state.xp + ' XP';
  document.getElementById('sb-xp-bar').style.width = pct + '%';

  let html = '';
  for (const course of COURSES) {
    const done = doneCourse(course);
    const isActiveCourse = state.activeCourse && state.activeCourse.id === course.id;
    html += `<div class="course-item ${isActiveCourse ? 'active' : ''}" data-course="${course.id}">
      <span class="course-icon">${course.icon}</span>
      <div class="course-info">
        <div class="course-name">${course.name}</div>
        <div class="course-meta">${done}/${course.topics.length} тем</div>
      </div>
      ${done === course.topics.length && done > 0 ? '<span class="course-badge">✓</span>' : `<span class="course-badge">${done > 0 ? done+'/' : ''}${course.topics.length}</span>`}
    </div>`;
    if (isActiveCourse) {
      for (const t of course.topics) {
        const isDone = state.done[t.id];
        const isActive = state.activeTopic && state.activeTopic.id === t.id;
        html += `<div class="topic-item ${isDone ? 'done' : ''} ${isActive ? 'active' : ''}" data-topic="${t.id}" data-course="${course.id}">
          <span class="t-dot"></span>${t.name}${isDone ? ' ✓' : ''}
        </div>`;
      }
    }
  }
  document.getElementById('sidebar-courses').innerHTML = `<div class="sidebar-section-label">Курсы</div>` + html;
}

function renderHome() {
  const doneCount = Object.keys(state.done).length;
  const total = totalTopics();
  const next = nextUndone();

  let continueCard = '';
  if (next) {
    continueCard = `<div class="continue-card" id="btn-continue">
      <div class="continue-emoji">${next.course.icon}</div>
      <div class="continue-info">
        <h3>${next.topic.name}</h3>
        <p>${next.course.name}</p>
      </div>
      <button class="continue-btn">Продолжить →</button>
    </div>`;
  }

  let coursesGrid = COURSES.map(c => {
    const done = doneCourse(c);
    const pct = c.topics.length ? Math.round(done / c.topics.length * 100) : 0;
    return `<div class="course-card" data-course="${c.id}">
      <div class="course-card-icon">${c.icon}</div>
      <div class="course-card-name">${c.name}</div>
      <div class="course-card-desc">${c.description}</div>
      <div class="mini-progress"><div class="mini-progress-bar" style="width:${pct}%"></div></div>
      <div class="course-card-foot"><span>${c.topics.length} тем</span><span>${pct}%</span></div>
    </div>`;
  }).join('');

  return `<div class="home-hero">
    <h1>Привет! Учи HTML & CSS 👋</h1>
    <p>Теория + практика в каждом уроке. ${doneCount} из ${total} тем завершено.</p>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Опыт</div><div class="stat-val green">${state.xp} XP</div></div>
    <div class="stat-card"><div class="stat-label">Тем пройдено</div><div class="stat-val orange">${doneCount}</div></div>
    <div class="stat-card"><div class="stat-label">Осталось</div><div class="stat-val blue">${total - doneCount}</div></div>
  </div>
  ${continueCard}
  <div class="courses-grid">${coursesGrid}</div>`;
}

function renderLesson() {
  const topic = state.activeTopic;
  const quizLen = topic.quiz.length;
  const totalSteps = 1 + quizLen; // 1 theory + n quiz
  const progressPct = Math.round(state.step / totalSteps * 100);

  const topBar = `<div class="lesson-topbar">
    <button class="back-btn" id="btn-back">← Назад</button>
    <div class="lesson-progress"><div class="lesson-progress-bar" id="lp-bar" style="width:${progressPct}%"></div></div>
    <div class="lesson-xp-live" id="live-xp">+${state.lessonXP} XP</div>
  </div>`;

  if (state.step === 0) {
    return `<div class="lesson-wrap">${topBar}${renderTheory()}</div>`;
  } else if (state.step <= quizLen) {
    const q = topic.quiz[state.step - 1];
    return `<div class="lesson-wrap">${topBar}${renderQuiz(q, state.step, quizLen)}</div>`;
  } else {
    return `<div class="lesson-wrap">${topBar}${renderComplete()}</div>`;
  }
}

function renderTheory() {
  const t = state.activeTopic.theory;
  const c = state.activeCourse;
  return `<div>
    <div class="theory-header">
      <div class="theory-course-tag">${c.icon} ${c.name}</div>
      <h2 class="theory-title">${t.title}</h2>
      <p class="theory-subtitle">${t.subtitle}</p>
    </div>
    <div class="theory-body">${t.html}</div>
    <div class="theory-nav">
      <button class="btn-primary" id="btn-to-quiz">Перейти к заданиям →</button>
    </div>
  </div>`;
}

function renderQuiz(q, qNum, total) {
  let body = '';
  if (q.type === 'choice') {
    const letters = ['A','B','C','D'];
    body = `<div class="choices">${q.choices.map((c,i) => `
      <button class="choice-btn" data-idx="${i}">
        <span class="choice-letter">${letters[i]}</span>
        <span>${c}</span>
      </button>`).join('')}</div>`;
  } else if (q.type === 'code') {
    body = `<div class="code-quiz-wrap">
      <div>
        <div class="pane-head"><span class="dot-g"></span>Твой код</div>
        <textarea class="code-editor" id="code-input" spellcheck="false">${q.starter}</textarea>
      </div>
      <div>
        <div class="pane-head"><span class="dot-b"></span>Результат</div>
        <div class="preview-frame"><iframe id="preview-frame" title="Превью"></iframe></div>
      </div>
    </div>`;
  } else if (q.type === 'fill') {
    body = `<div class="fill-line">${q.line}</div>`;
  }

  return `<div>
    <div class="quiz-tag">Вопрос ${qNum} из ${total}</div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-sub">${q.type === 'code' ? 'Напиши код и нажми «Проверить»' : q.type === 'fill' ? 'Заполни пропуск' : 'Выбери один правильный ответ'}</div>
    ${body}
    <div class="quiz-feedback" id="quiz-feedback">
      <span class="fb-icon" id="fb-icon"></span>
      <div class="fb-msg" id="fb-msg"></div>
    </div>
    <div class="quiz-nav">
      <button class="btn-secondary" id="btn-hint-q">💡 Подсказка</button>
      <button class="btn-check" id="btn-check-q" ${q.type === 'choice' ? 'disabled' : ''}>Проверить</button>
    </div>
  </div>`;
}

function renderComplete() {
  const topic = state.activeTopic;
  const course = state.activeCourse;
  const next = course.topics.find((t,i) => {
    const idx = course.topics.indexOf(topic);
    return i > idx && !state.done[t.id];
  });
  return `<div class="complete-wrap">
    <div class="complete-icon">🎉</div>
    <div class="complete-title">Тема пройдена!</div>
    <div class="complete-sub">«${topic.name}» — ${course.name}</div>
    <div class="xp-pill">⚡ +${state.lessonXP} XP</div>
    <div class="complete-btns">
      <button class="btn-secondary" id="btn-home">На главную</button>
      ${next ? `<button class="btn-primary" id="btn-next-topic" data-topic="${next.id}">Следующая тема →</button>` : `<button class="btn-primary" id="btn-home2">Завершить курс 🏆</button>`}
    </div>
  </div>`;
}

/* ══════ EVENTS ══════ */
function bindEvents() {
  // Sidebar course click
  document.querySelectorAll('.course-item[data-course]').forEach(el => {
    el.addEventListener('click', () => {
      const c = COURSES.find(x => x.id === el.dataset.course);
      if (!c) return;
      if (state.activeCourse && state.activeCourse.id === c.id) {
        state.activeCourse = null;
      } else {
        state.activeCourse = c;
        state.activeTopic = null;
      }
      state.screen = 'home';
      render();
    });
  });

  // Sidebar topic click
  document.querySelectorAll('.topic-item[data-topic]').forEach(el => {
    el.addEventListener('click', () => {
      const c = COURSES.find(x => x.id === el.dataset.course);
      const t = c && c.topics.find(x => x.id === el.dataset.topic);
      if (!t) return;
      startLesson(c, t);
    });
  });

  // Home cards
  document.querySelectorAll('.course-card[data-course]').forEach(el => {
    el.addEventListener('click', () => {
      const c = COURSES.find(x => x.id === el.dataset.course);
      if (!c) return;
      state.activeCourse = c;
      const first = c.topics.find(t => !state.done[t.id]) || c.topics[0];
      startLesson(c, first);
    });
  });

  // Continue button
  const btnContinue = document.getElementById('btn-continue');
  if (btnContinue) btnContinue.addEventListener('click', () => {
    const next = nextUndone();
    if (next) startLesson(next.course, next.topic);
  });

  // Lesson events
  const btnBack = document.getElementById('btn-back');
  if (btnBack) btnBack.addEventListener('click', () => {
    state.screen = 'home'; render();
  });

  const btnToQuiz = document.getElementById('btn-to-quiz');
  if (btnToQuiz) btnToQuiz.addEventListener('click', () => {
    state.step = 1; render(); setupQuizStep();
  });

  const btnCheck = document.getElementById('btn-check-q');
  if (btnCheck) btnCheck.addEventListener('click', checkAnswer);

  const btnHint = document.getElementById('btn-hint-q');
  if (btnHint) btnHint.addEventListener('click', showHint);

  // Choice buttons
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.answered) return;
      state.selectedChoice = parseInt(btn.dataset.idx);
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      const checkBtn = document.getElementById('btn-check-q');
      if (checkBtn) checkBtn.disabled = false;
    });
  });

  // Next topic from complete
  const btnNextTopic = document.getElementById('btn-next-topic');
  if (btnNextTopic) btnNextTopic.addEventListener('click', () => {
    const t = state.activeCourse.topics.find(x => x.id === btnNextTopic.dataset.topic);
    if (t) startLesson(state.activeCourse, t);
  });

  const btnHome = document.getElementById('btn-home');
  if (btnHome) btnHome.addEventListener('click', () => { state.screen = 'home'; render(); });
  const btnHome2 = document.getElementById('btn-home2');
  if (btnHome2) btnHome2.addEventListener('click', () => { state.screen = 'home'; render(); });

  setupQuizStep();
}

function setupQuizStep() {
  if (state.screen !== 'lesson' || state.step === 0 || state.step > state.activeTopic.quiz.length) return;
  const q = state.activeTopic.quiz[state.step - 1];
  state.answered = false;
  state.selectedChoice = null;
  if (q.type === 'code') {
    const input = document.getElementById('code-input');
    const frame = document.getElementById('preview-frame');
    if (input && frame) {
      const update = () => {
        const doc = frame.contentDocument || frame.contentWindow.document;
        doc.open(); doc.write(`<!DOCTYPE html><html><head><style>body{font-family:sans-serif;padding:10px;font-size:13px;}</style></head><body>${input.value}</body></html>`); doc.close();
      };
      input.addEventListener('input', update);
      update();
    }
  }
}

function showHint() {
  const q = state.activeTopic.quiz[state.step - 1];
  const fb = document.getElementById('quiz-feedback');
  const icon = document.getElementById('fb-icon');
  const msg = document.getElementById('fb-msg');
  if (!fb) return;
  fb.className = 'quiz-feedback show';
  fb.style.background = 'var(--yellow-dim)';
  fb.style.borderColor = 'rgba(251,191,36,0.3)';
  fb.style.color = 'var(--yellow)';
  if (icon) icon.textContent = '💡';
  if (msg) msg.innerHTML = `<strong>Подсказка</strong>${q.hint}`;
}

function checkAnswer() {
  if (state.answered) { advanceStep(); return; }
  const q = state.activeTopic.quiz[state.step - 1];
  let correct = false;

  if (q.type === 'choice') {
    correct = state.selectedChoice === q.correct;
    document.querySelectorAll('.choice-btn').forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('correct');
      else if (i === state.selectedChoice && !correct) btn.classList.add('wrong');
    });
  } else if (q.type === 'code') {
    const code = document.getElementById('code-input')?.value || '';
    correct = q.check(code);
  } else if (q.type === 'fill') {
    const ans = document.getElementById('fill-ans')?.value?.trim() || '';
    correct = ans.toLowerCase() === q.answer.toLowerCase();
  }

  state.answered = true;
  const xpEarned = correct ? 10 : 0;
  state.lessonXP += xpEarned;

  const fb = document.getElementById('quiz-feedback');
  const icon = document.getElementById('fb-icon');
  const msg = document.getElementById('fb-msg');
  const checkBtn = document.getElementById('btn-check-q');

  if (fb) {
    fb.className = 'quiz-feedback show ' + (correct ? 'ok' : 'fail');
    fb.style.background = '';
    fb.style.borderColor = '';
    fb.style.color = '';
  }
  if (icon) icon.textContent = correct ? '✅' : '❌';
  if (msg) msg.innerHTML = correct
    ? `<strong>Верно! +${xpEarned} XP</strong>${q.explain || ''}`
    : `<strong>Не совсем...</strong>${q.hint || q.explain || 'Попробуй ещё раз!'}`;
  if (checkBtn) { checkBtn.textContent = 'Далее →'; checkBtn.disabled = false; }
  document.getElementById('live-xp').textContent = '+' + state.lessonXP + ' XP';
}

function advanceStep() {
  state.step++;
  if (state.step > state.activeTopic.quiz.length) {
    // Complete!
    state.done[state.activeTopic.id] = true;
    state.xp += state.lessonXP;
    save();
  }
  render();
  if (state.step > 0 && state.step <= state.activeTopic.quiz.length) setupQuizStep();
  updateProgressBar();
}

function updateProgressBar() {
  const bar = document.getElementById('lp-bar');
  if (!bar) return;
  const total = 1 + state.activeTopic.quiz.length;
  bar.style.width = Math.round(state.step / total * 100) + '%';
}

function startLesson(course, topic) {
  state.activeCourse = course;
  state.activeTopic = topic;
  state.screen = 'lesson';
  state.step = 0;
  state.lessonXP = 0;
  state.answered = false;
  state.selectedChoice = null;
  render();
}

render();
</script>
</body>
</html>
