<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог Аватарок</title>
  <style>
    :root { --bg-color: #121212; --text-color: #ffffff; --accent-color: #ff4757; --card-bg: #1e1e1e; }
    body { margin: 0; font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); text-align: center; }
    header { padding: 40px 20px; background: linear-gradient(135deg, #ff4757, #ff6b81); }
    .search-container { margin: 20px auto; max-width: 500px; padding: 0 20px; }
    #searchInput { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; background: var(--card-bg); color: white; font-size: 16px; box-sizing: border-box; outline: none; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; padding: 40px; max-width: 1200px; margin: 0 auto; }
    .avatar-card { background-color: var(--card-bg); border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
    .avatar-card img { width: 100%; height: 180px; object-fit: cover; background: #2d2d2d; }
    .card-info { padding: 15px; display: flex; flex-direction: column; gap: 10px; align-items: center; flex-grow: 1; justify-content: space-between; }
    .tags-list { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
    .tag { font-size: 11px; background: #2d2d2d; padding: 3px 8px; border-radius: 10px; color: #ff6b81; }
    .download-btn { display: inline-block; background-color: var(--accent-color); color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; width: 90%; box-sizing: border-box; transition: 0.2s; }
    .download-btn:hover { background-color: #ff2e44; }
  </style>
</head>
<body>

  <header>
    <h1>Топовые Аватарки</h1>
    <p>Качай в один клик без ограничений!</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Поиск по тегам...">
  </div>

  <main class="gallery" id="gallery">Загрузка каталога...</main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    // ВСТАВЬ СЮДА КОНФИГ СВОЕГО НОВОГО ПРОЕКТА AVATARS
const firebaseConfig = {
  apiKey: "AIzaSyA5cuTeZ2kd0rozla6uCevFdMIdkSUJ-3A",
  authDomain: "avatars-3b43c.firebaseapp.com",
  projectId: "avatars-3b43c",
  storageBucket: "avatars-3b43c.firebasestorage.app",
  messagingSenderId: "1036632870989",
  appId: "1:1036632870989:web:92e306905ccb3839500c04",
  measurementId: "G-SQBD6RJT9E"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allAvatars = [];

    async function loadCatalog() {
      const gallery = document.getElementById('gallery');
      try {
        // Запрашиваем список аватарок, сортируя по времени добавления
        const q = query(collection(db, "avatars_list"), orderBy("time", "desc"));
        const querySnapshot = await getDocs(q);
        
        allAvatars = [];
        querySnapshot.forEach((doc) => {
          allAvatars.push(doc.data());
        });

        renderGallery(allAvatars);
      } catch (error) {
        gallery.innerText = "Ошибка загрузки каталога: " + error.message;
      }
    }

    function renderGallery(items) {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      if (items.length === 0) {
        gallery.innerHTML = '<div style="grid-column: 1/-1; padding: 20px; opacity: 0.5;">Ничего не найдено</div>';
        return;
      }

      items.forEach((avatar, index) => {
        // Защита: если тегов почему-то нет, создаем пустой массив
        const tags = avatar.tags || [];
        const tagsHTML = tags.map(tag => `<span class="tag">#${tag}</span>`).join('');

        const card = document.createElement('div');
        card.className = 'avatar-card';

        card.innerHTML = `
          <img src="${avatar.image}" alt="Аватарка">
          <div class="card-info">
            <div class="tags-list">${tagsHTML}</div>
            <a href="${avatar.image}" download="avatar-${index}.jpg" class="download-btn">Скачать</a>
          </div>
        `;
        gallery.appendChild(card);
      });
    }

    // Живой поиск по тегам
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchText = e.target.value.toLowerCase().trim();
      if (searchText === '') { 
        renderGallery(allAvatars); 
        return; 
      }
      
      const filtered = allAvatars.filter(avatar => {
        const tags = avatar.tags || [];
        return tags.some(tag => tag.includes(searchText));
      });
      renderGallery(filtered);
    });

    // Запускаем загрузку при старте страницы
    loadCatalog();
  </script>
</body>
</html>
